[project]
name = "junkicide"
version = "0.1.0"
description = "TUI для macOS: найти и осознанно прибить забытые прожорливые процессы и ненужные гигабайты на диске"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "textual>=0.80",
    "psutil>=6.0",
]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
]

[project.scripts]
junkicide = "junkicide.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/junkicide"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF100"]
ignore = ["E731", "B023", "E501"]  # длину держим ~110, но эмодзи и русские тексты ruff считает неточно
