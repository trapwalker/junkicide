[project]
name = "junkicide"
version = "0.1.0"
description = "TUI для macOS: найти и осознанно прибить забытые прожорливые процессы и ненужные гигабайты на диске"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "trapwalker" }]
keywords = ["macos", "tui", "cleanup", "disk-space", "process-monitor", "docker", "android-emulator"]
dependencies = [
    "textual>=0.80",
    "psutil>=6.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Russian",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/trapwalker/junkicide"
Issues = "https://github.com/trapwalker/junkicide/issues"

[project.scripts]
junkicide = "junkicide.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/junkicide"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF100"]
ignore = ["E731", "B023", "E501"]  # длину держим ~110, но эмодзи и русские тексты ruff считает неточно
